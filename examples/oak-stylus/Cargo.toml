[package]
name = "oak-stylus"
description = "Stylus language support for Oak framework"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
oak-core = { workspace = true }
triomphe = { workspace = true }
oak-lsp = { workspace = true, optional = true }
oak-hover = { workspace = true, optional = true }
oak-vfs = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt", "net"] }
oak-highlight = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
oak-mcp = { workspace = true, optional = true }

[features]
# Enable LSP support
lsp = ["dep:oak-lsp", "dep:oak-hover", "dep:oak-vfs", "dep:oak-highlight", "dep:futures"]
# Enable MCP support
mcp = ["dep:tokio", "dep:oak-mcp", "dep:oak-lsp"]
# Enable highlighting support
oak-highlight = []
# Enable pretty print support
oak-pretty-print = []
