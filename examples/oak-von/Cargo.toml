[package]
name = "oak-von"
version.workspace = true
authors.workspace = true
description = "Valkyrie language parser with support for modern Valkyrie syntax and features."
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository = "https://github.com/ygg-lang/oaks/tree/master/examples/oak-von"
documentation = "https://docs.rs/oak-von"
categories = ["parsing"]
keywords = ["parser", "valkyrie", "language"]

[dependencies]
oak-core = { workspace = true }
serde = { workspace = true, optional = true }

[features]
default = ["serde"]
serde = ["dep:serde", "oak-core/serde"]

[package.metadata.docs.rs]
all-features = true
