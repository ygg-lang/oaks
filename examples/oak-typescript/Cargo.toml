[package]
name = "oak-typescript"
version.workspace = true
authors.workspace = true
description = "TypeScript frontend for Oak"
edition.workspace = true
license.workspace = true
repository = "https://github.com/ygg-lang/oaks/tree/master/examples/oak-typescript"
categories = ["compilers", "development-tools"]
keywords = ["frontend", "language", "typescript"]

[dependencies]
oak-core = { workspace = true }
serde = { workspace = true, optional = true }
# serde_json = { workspace = true } # replaced by oak-json
oak-json = { workspace = true }

[features]
default = ["serde"]
serde = ["dep:serde", "oak-core/serde"]

[dev-dependencies]
oak-testing = { workspace = true }
lazy_static = { workspace = true }
