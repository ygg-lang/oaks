[workspace]
resolver = "2"
members = [
    "projects/*",
    "examples/*",
]
exclude = [
    "projects/.DS_Store",
]

[workspace.package]
version = "0.0.8"
authors = ["Yggdrasill Team <192607617@qq.com>"]
edition = "2024"
license = "MPL-2.0"
homepage = "https://github.com/ygg-lang/oaks"
repository = "https://github.com/ygg-lang/oaks"
readme = "readme.md"

[workspace.dependencies]
# External dependencies removed to achieve architectural independence
walkdir = { version = "2.5.0" }
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = { version = "1.0.149" }
schemars = { version = "1.2.1", features = ["derive"] }
tracing = { version = "0.1.44" }
unicode-ident = { version = "1.0.24" }
url = { version = "2.5.8", features = ["serde"] }
triomphe = { version = "0.1.15", default-features = false, features = ["serde"] }
smallvec = { version = "1.15", features = ["union", "const_generics", "const_new"] }
proc-macro2 = { version = "1.0.106" }
quote = { version = "1.0.45" }
syn = { version = "2.0.117", features = ["full"] }
tokio = { version = "1.50.0", default-features = false }
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
futures = { version = "0.3.32" }
dashmap = { version = "6.1.0" }
lazy_static = "1.5.0"
anyhow = "1.0.102"
thiserror = "2.0.18"
itertools = "0.14.0"
chrono = "0.4.44"
notify = "8.2.0"
crossterm = "0.29.0"
unicode-width = "0.2.2"
clap = { version = "4.5.60", features = ["derive"] }
axum = "0.8.8"
arcstr = { version = "1.2.0", features = ["serde"] }
indexmap = { version = "2.13.0", features = ["serde"] }
im-rc = "15.1.0"
num = "0.4.3"
bigdecimal = "0.4.10"
ordered-float = "5.1.0"
twox-hash = "2.1.2"
regex = "1.12"
base64 = "0.22.0"

# Internal project dependencies
oak-core = { version = "0.0.8", path = "projects/oak-core" }
oak-macros = { version = "0.0.8", path = "projects/oak-macros" }
oak-vfs = { version = "0.0.8", path = "projects/oak-vfs" }
oak-symbols = { version = "0.0.8", path = "projects/oak-symbols" }
oak-resolver = { version = "0.0.8", path = "projects/oak-resolver" }
oak-diagnostic = { version = "0.0.8", path = "projects/oak-diagnostic" }
oak-highlight = { version = "0.0.8", path = "projects/oak-highlight" }
oak-pretty-print = { version = "0.0.8", path = "projects/oak-pretty-print" }
oak-lsp = { version = "0.0.8", path = "projects/oak-lsp" }
oak-folding = { version = "0.0.8", path = "projects/oak-folding" }
oak-hover = { version = "0.0.8", path = "projects/oak-hover" }
oak-navigation = { version = "0.0.8", path = "projects/oak-navigation" }
oak-repl = { version = "0.0.8", path = "projects/oak-repl" }
oak-semantic-tokens = { version = "0.0.8", path = "projects/oak-semantic-tokens" }
oak-structural-view = { version = "0.0.8", path = "projects/oak-structural-view" }
oak-semantic-search = { version = "0.0.8", path = "projects/oak-semantic-search" }
oak-visualize = { version = "0.0.8", path = "projects/oak-visualize" }
oak-testing = { version = "0.0.8", path = "projects/oak-testing" }
oak-mcp = { version = "0.0.8", path = "projects/oak-mcp" }
oak-source-map = { version = "0.0.8", path = "projects/oak-source-map" }
oaks = { version = "0.0.8", path = "projects/oaks" }

